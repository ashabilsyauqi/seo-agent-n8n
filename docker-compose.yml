# =====================================================================
# SEO Agent (n8n): stack lokal & VPS
#
#   n8n          : editor workflow + AI Agent + chat        -> http://localhost:5678
#   postgres     : database n8n + database "seo" (pgvector: knowledge base, cache, memori chat)
#   ollama       : embedding bge-m3 (Hermes lokal opsional), TIDAK diekspos ke internet
#   ollama-init  : sekali jalan, download model embedding
#
#   ./scripts/setup.sh          # pertama kali (buat .env, start, import workflow)
#   docker compose up -d        # start biasa
#   docker compose down         # stop (data tetap aman di volume)
# =====================================================================
name: seo-agent-n8n

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: n8n
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # hanya dijalankan saat volume masih kosong
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT:-5433}:5432"  # buat buka DB dari TablePlus/DBeaver (localhost saja)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  ollama:
    image: ollama/ollama:0.35.1
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    logging: *logging

  ollama-init:
    image: ollama/ollama:0.35.1
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      PULL_HERMES: ${PULL_HERMES:-false}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "⬇ Embedding model: $$EMBEDDING_MODEL"
        ollama pull "$$EMBEDDING_MODEL"
        if [ "$$PULL_HERMES" = "true" ]; then
          ollama pull hermes3:8b
          printf 'FROM hermes3:8b\nPARAMETER num_ctx 16384\nPARAMETER temperature 0.3\n' > /tmp/Modelfile
          ollama create hermes3-seo -f /tmp/Modelfile
        fi
        echo "✅ Model siap."
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.41.6}
    environment:
      # --- database n8n ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # --- inti ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?isi N8N_ENCRYPTION_KEY di .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_PORT: 5678
      N8N_LISTEN_ADDRESS: 0.0.0.0                         # IPv4 (beberapa VPS/Docker tanpa IPv6)
      N8N_WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}       # true di VPS (HTTPS)
      GENERIC_TIMEZONE: ${TZ:-Asia/Jakarta}
      TZ: ${TZ:-Asia/Jakarta}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"               # workflow membaca konfigurasi di bawah lewat $env
      NODE_FUNCTION_ALLOW_BUILTIN: "*"                    # izinkan crypto, fs, dll di Code node
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336                          # simpan riwayat eksekusi 14 hari
      # --- konfigurasi aplikasi SEO (dibaca workflow sebagai $env.X) ---
      SITE_NAME: ${SITE_NAME:-Difitech}
      SITE_DOMAIN: ${SITE_DOMAIN:-difitech.id}
      WP_BASE_URL: ${WP_BASE_URL:-https://difitech.id}
      WP_POST_TYPES: ${WP_POST_TYPES:-posts,pages}
      INGEST_MAX_PAGES: ${INGEST_MAX_PAGES:-0}
      RESPONSE_LANGUAGE: ${RESPONSE_LANGUAGE:-Bahasa Indonesia}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      CHUNK_SIZE: ${CHUNK_SIZE:-1500}
      RAG_TOP_K: ${RAG_TOP_K:-3}
      RAG_FETCH_K: ${RAG_FETCH_K:-20}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.50}
      RAG_MAX_CHARS_PER_PAGE: ${RAG_MAX_CHARS_PER_PAGE:-900}
      SCRAPE_MAX_CHARS: ${SCRAPE_MAX_CHARS:-12000}
      SCRAPE_CACHE_HOURS: ${SCRAPE_CACHE_HOURS:-6}
      JINA_API_KEY: ${JINA_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      # GEMINI_API_KEY sengaja TIDAK dimasukkan ke sini: disimpan terenkripsi sebagai
      # credential n8n oleh scripts/setup.sh (lihat n8n/scripts/render-credentials.js).
    ports:
      - "${N8N_BIND_IP:-127.0.0.1}:${N8N_PUBLISH_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/import:ro
      - ./credentials:/credentials:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  ollama-models:
  n8n-data:
